    <!-- Immediate API / Cached Logo & Shop Name Applicator for Favicon & Meta Tags -->
    <script>
      (function() {
        // Suppress noisy third-party browser extension console errors
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason ? String(e.reason) : '';
          if (reason.indexOf('disconnected port') !== -1 || reason.indexOf('Could not establish connection') !== -1 || reason.indexOf('BHK') !== -1) {
            e.preventDefault();
          }
        });
        window.addEventListener('error', function(e) {
          var msg = e && e.message ? String(e.message) : '';
          if (msg.indexOf('disconnected port') !== -1 || msg.indexOf('Could not establish connection') !== -1 || msg.indexOf('BHK') !== -1) {
            if (e.preventDefault) e.preventDefault();
          }
        }, true);

        function applyLogoUrl(url) {
          if (!url) return;
          var fav = document.getElementById('app-favicon');
          if (fav) fav.href = url;
          var shortFav = document.getElementById('app-shortcut-icon');
          if (shortFav) shortFav.href = url;
          var appleFav = document.getElementById('app-apple-icon');
          if (appleFav) appleFav.href = url;
          var ogImg = document.getElementById('app-og-image');
          if (ogImg) ogImg.setAttribute('content', url);
          var twImg = document.getElementById('app-twitter-image');
          if (twImg) twImg.setAttribute('content', url);
        }

        function applyShopName(name) {
          if (!name) return;
          var cleanName = String(name).trim();
          if (!cleanName) return;

          var ogSite = document.getElementById('app-og-site-name') || document.querySelector("meta[property='og:site_name']");
          if (ogSite) ogSite.setAttribute('content', cleanName);

          var appleTitle = document.getElementById('app-apple-title') || document.querySelector("meta[name='apple-mobile-web-app-title']");
          if (appleTitle) appleTitle.setAttribute('content', cleanName);

          var ogTitle = document.getElementById('app-og-title') || document.querySelector("meta[property='og:title']");
          if (ogTitle) ogTitle.setAttribute('content', cleanName + ' | Sivakasi Direct Store');

          var twTitle = document.getElementById('app-twitter-title') || document.querySelector("meta[name='twitter:title']");
          if (twTitle) twTitle.setAttribute('content', cleanName + ' | Sivakasi Direct Store');

          document.title = cleanName + ' | Sivakasi Direct Festive Fireworks & Combos';
        }

        function applyShopAddress(address) {
          if (!address) return;
          var cleanAddr = String(address).trim();
          if (!cleanAddr) return;

          var geoPlace = document.getElementById('app-geo-placename') || document.querySelector("meta[name='geo.placename']");
          if (geoPlace) geoPlace.setAttribute('content', cleanAddr);
        }

        function resolveAndApplyLogo(logoRaw, adminId) {
          if (!logoRaw) return;
          var domain = 'https://offer360.in';
          var fullUrl = logoRaw;
          if (!logoRaw.startsWith('http://') && !logoRaw.startsWith('https://') && !logoRaw.startsWith('data:')) {
            if (logoRaw.indexOf('/uploads_crackers/') !== -1) {
              fullUrl = domain + logoRaw.substring(logoRaw.indexOf('/uploads_crackers/'));
            } else if (logoRaw.startsWith('/')) {
              fullUrl = domain + logoRaw;
            } else {
              var aid = adminId || 2;
              fullUrl = domain + '/uploads_crackers/' + aid + '/footer/' + logoRaw;
            }
          }
          applyLogoUrl(fullUrl);
        }

        // 1. Direct cached checks
        try {
          var directLogo = localStorage.getItem('sds_logo_url');
          if (directLogo) applyLogoUrl(directLogo);

          var directShop = localStorage.getItem('sds_shop_name');
          if (directShop) applyShopName(directShop);

          var directAddr = localStorage.getItem('sds_shop_address');
          if (directAddr) applyShopAddress(directAddr);
        } catch (e) {}

        // 2. Local storage footer data cache check
        try {
          var cached = localStorage.getItem('sds_footer_data');
          if (cached) {
            var data = JSON.parse(cached);
            var item = Array.isArray(data) ? data[0] : (data.data ? (Array.isArray(data.data) ? data.data[0] : data.data) : data);
            if (item) {
              var logo = item.image_url || item.logo_url || item.logo || item.image || item.footer_logo || item.shop_logo || item.logo_image || item.site_logo;
              if (logo) resolveAndApplyLogo(logo, item.admin_id);

              var sName = item.shop_name || item.shop_title || item.name || item.store_name;
              if (sName) applyShopName(sName);

              var sAddr = item.shop_address || item.address || item.location;
              if (sAddr) applyShopAddress(sAddr);
            }
          }
        } catch (e) {}

        function extractShopDomain() {
          try {
            var queryMatch = window.location.search.match(/[?&](shopDomain|domain)=([^&]+)/i);
            if (queryMatch && queryMatch[2]) return decodeURIComponent(queryMatch[2]).trim().toLowerCase();

            var host = (window.location.hostname || '').toLowerCase().split(':')[0];
            if (!host || host === 'localhost' || host === '127.0.0.1' || /^(\d{1,3}\.){3}\d{1,3}$/.test(host)) {
              return 'shivacrackers.pattaz.com';
            }
            if (host.indexOf('www.') === 0) {
              host = host.slice(4);
            }
            return host || 'shivacrackers.pattaz.com';
          } catch (e) {
            return 'shivacrackers.pattaz.com';
          }
        }

        // 3. Direct API fetch for fresh footer data
        try {
          var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
          var apiUrl = isLocal ? '/fireworks/crackers/getfooter' : 'https://offer360.in/fireworks/crackers/getfooter';

          fetch(apiUrl, {
            headers: { 
              'x-shop-domain': extractShopDomain()
            }
          })
          .then(function(res) { return res.json(); })
          .then(function(json) {
            if (!json) return;
            var data = json.data || json;
            var item = Array.isArray(data) ? data[0] : data;
            if (item) {
              var logo = item.image_url || item.logo_url || item.logo || item.image || item.footer_logo || item.shop_logo || item.logo_image || item.site_logo;
              if (logo) resolveAndApplyLogo(logo, item.admin_id);

              var sName = item.shop_name || item.shop_title || item.name || item.store_name;
              if (sName) applyShopName(sName);

              var sAddr = item.shop_address || item.address || item.location;
              if (sAddr) applyShopAddress(sAddr);
            }
          })
          .catch(function() {});
        } catch (e) {}
      })();
    </script>
